<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HakkaGo! 客語認證海量特訓與智慧闖關島</title>
    <!-- 引入 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Animate.css 增強動畫庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <style>
        .btn-3d {
            transition: all 0.1s ease;
            transform: translateY(0);
        }
        .btn-3d:active:not(:disabled) {
            transform: translateY(4px);
            border-bottom-width: 0px !important;
        }
        .bg-mesh {
            background-color: #f8fafc;
            background-image: radial-gradient(at 0% 0%, rgba(240, 253, 244, 1) 0, transparent 50%), 
                              radial-gradient(at 100% 100%, rgba(245, 243, 255, 1) 0, transparent 50%);
        }
        .glow-progress { box-shadow: 0 0 12px rgba(16, 185, 129, 0.5); }
        
        /* 仿多鄰國地圖路徑虛線 */
        .map-path { position: relative; }
        .map-path::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 32px;
            border-left: 4px dashed #cbd5e1;
            z-index: 0;
        }
        .map-path:last-child::after { display: none; }

        /* ==========================================
           🐆 全身石虎小栗高級 CSS 骨架核心動畫
           ========================================== */
        
        /* 1. 身體整體呼吸起伏 */
        .leopard-body-breathe {
            animation: leopardBreathe 3s ease-in-out infinite;
            transform-origin: bottom center;
        }
        @keyframes leopardBreathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02) translateY(-2px); }
        }

        /* 2. 頭部俏皮搖晃 */
        .leopard-head-shake {
            animation: leopardHead 4s ease-in-out infinite;
            transform-origin: 50px 55px;
        }
        @keyframes leopardHead {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-3deg); }
            75% { transform: rotate(3deg); }
        }

        /* 3. 左手招財揮動 */
        .leopard-left-paw {
            animation: waveLeftPaw 1.5s ease-in-out infinite;
            transform-origin: 32px 75px;
        }
        @keyframes waveLeftPaw {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-20deg) translateY(-3px); }
        }

        /* 4. 右手開心揮動 */
        .leopard-right-paw {
            animation: waveRightPaw 1.8s ease-in-out infinite;
            transform-origin: 68px 75px;
        }
        @keyframes waveRightPaw {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(25deg) translateY(-2px); }
        }

        /* 5. 軟Q石虎斑紋尾巴搖擺 */
        .leopard-tail-wag {
            animation: wagTail 2.5s ease-in-out infinite;
            transform-origin: 70px 88px;
        }
        @keyframes wagTail {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(18deg) translateX(2px); }
        }

        /* 轉場專用過場特效 */
        @keyframes leopard-roll {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.3) rotate(180deg) translateX(40px); opacity: 0.8; }
            100% { transform: scale(0) rotate(360deg) translateX(180px); opacity: 0; }
        }
        @keyframes leopard-jump {
            0% { transform: translateY(0) scale(1); }
            30% { transform: translateY(10px) scaleY(0.85); }
            60% { transform: translateY(-100px) scaleY(1.15); opacity: 0.6; }
            100% { transform: translateY(-180px) scale(0); opacity: 0; }
        }
        .animate-leopard-roll { animation: leopard-roll 0.65s ease-in-out forwards; }
        .animate-leopard-jump { animation: leopard-jump 0.65s ease-in-out forwards; }
    </style>
</head>
<body class="bg-mesh text-slate-800 font-sans min-h-screen flex flex-col antialiased">

                        <button onclick="triggerMascotTransition('advanced', false)" class="btn-3d w-full p-2.5 bg-white border border-slate-200 hover:border-purple-400 rounded-xl flex items-center justify-between text-left shadow-sm text-xs font-bold border-b-4">

                <div>

                    <h3 class="text-3xl font-black mt-1 tracking-tight flex items-baseline gap-1">

    <script>

        function handleAuthSubmit() {
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            const nickname = document.getElementById('auth-nickname').value.trim();
            if (!username || !password) { alert("請輸入完整帳密！"); return; }
            let users = getLocalUsers();

            if (authMode === 'register') {
                if (!nickname) { alert("請輸入暱稱"); return; }
                if (users[username]) { alert("帳號已存在"); return; }
                users[username] = { username, password, nickname, points: 0, streak: 1, unlockedLevels: ["level_1"], isGuest: false };
                saveLocalUsers(users);
            }
            if (!users[username] || users[username].password !== password) { alert("密碼錯誤"); return; }
            loginSuccess(users[username]);
        }

            let users = getLocalUsers();

                        <div>
                            <p class="text-sm font-black text-red-700">哎呀，不小心選錯了！</p>
                            <p class="text-[11px] text-red-600">正確答案是：${q.correct_answer || q.expect_text}</p>
                        </div>
                    `;
                    document.getElementById('quiz-mini-leopard').className = "w-10 h-10 flex items-center justify-center opacity-50";
                    currentUser.hearts--;
                    document.getElementById('quiz-hearts-display').innerText = currentUser.hearts;

                    if (currentUser.hearts <= 0) {
                        document.getElementById('modal-leopard-img').className = "w-28 h-28 mb-2 flex items-center justify-center opacity-50";
                        showModal('挑戰失敗', '愛心歸零了，先跟著小栗回大廳檢討錯題吧！', () => { showScreen('welcome-screen'); });
                        return;
                    }
                }
                actionBtn.innerText = "下一題";
            } else {
                currentIdx++;
                renderCurrentQuestion();
            }
        }

        function toggleSpeechRecording() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { alert("瀏覽器不支援語音辨識機制"); return; }
            if (!recognition) {
                recognition = new SpeechRecognition();
                recognition.lang = "zh-TW";
                recognition.onresult = (e) => {
                    const txt = e.results[0][0].transcript;
                    document.getElementById('speak-result-box').innerText = `偵測到發音：${txt}`;
                    selectedAns = txt;
                    document.getElementById('quiz-action-btn').disabled = false;
                    document.getElementById('quiz-action-btn').className = "btn-3d w-full sm:w-44 py-3 rounded-2xl font-bold text-white bg-emerald-500 border-b-4 border-emerald-700 active:border-b-0 text-sm shadow cursor-pointer";
                };
            }
            recognition.start();
        }

        function redeemReward(name, cost) {
            if (currentUser.points < cost) { 
                document.getElementById('modal-leopard-img').className = "w-28 h-28 mb-2 flex items-center justify-center opacity-70";
                showModal('點數不足哩', `再加把勁去刷題或闖關累積點數吧！`, null); 
            } else { 
                currentUser.points -= cost; 
                syncUserProgressToStorage(); 
                document.getElementById('modal-leopard-img').className = "w-28 h-28 mb-2 flex items-center justify-center animate__animated animate__jackInTheBox";
                showModal('兌換成功！', `商品已安全存入保險箱！`, null); 
            }
        }

        let modalCallback = null;
        function showModal(title, desc, callback = null) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            modalCallback = callback;

            const lectureBox = document.getElementById('wrong-questions-lecture');
            if (wrongQuestionsLog.length > 0) {
                lectureBox.classList.remove('hidden');
                let h = `<p class="text-xs font-black text-indigo-900 border-b pb-1 mb-2">🐾 小栗老師 AI 錯題指引教室：</p>`;
                wrongQuestionsLog.forEach(w => {
                    let cleanQ = w.question_text.replace(/\n/g, ' ');
                    h += `<div class="bg-white p-2 rounded border border-slate-200 text-[11px]">
                        <strong>${cleanQ}</strong><br>
                        <span class="text-red-500">殘念答案: ${w.your_answer}</span> | <span class="text-green-600 font-bold">標準解: ${w.correct_answer}</span>
                    </div>`;
                });
                lectureBox.innerHTML = h;
            } else { lectureBox.classList.add('hidden'); }
            document.getElementById('global-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('global-modal').classList.add('hidden');
            document.getElementById('modal-leopard-img').className = "w-28 h-28 mb-2 flex items-center justify-center";
            if (modalCallback) { modalCallback(); modalCallback = null; }
        }

        function quitQuiz() { if(confirm("確定要拋棄小栗退出此局嗎？")) showScreen('welcome-screen'); }

        window.onload = function() {
            initLeopardHTML();

            const sessionUser = sessionStorage.getItem('hakkago_current_session');
            if (sessionUser) {
                let users = getLocalUsers();
                if (users[sessionUser]) {
                    currentUser = users[sessionUser];
                    document.getElementById('nav-user-stats').classList.remove('hidden');
                    document.getElementById('logout-btn').classList.remove('hidden');
                    showScreen('welcome-screen');
                    return;
                }
            }
            showScreen('auth-screen');
        };
    </script>
</body>
</html>
